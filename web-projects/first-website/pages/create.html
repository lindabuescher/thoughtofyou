<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <h1 id="typing-text">Let's create something special</h1>
    
    <main>
        <section class="form-section">
            <h2>Who are you thinking about?</h2>
            <input type="text" id="recipient-name" placeholder="Enter their name" required>
        </section>

        <section class="form-section">
            <h2>What do you want to set as your headline?</h2>
            <input type="text" id="custom-headline" placeholder="Enter your headline" required>
            <button type="button" id="confirm-headline">Confirm</button>
        </section>

        <section class="form-section">
            <h2>Upload your pictures</h2>
            <input type="file" id="picture-upload" multiple accept="image/*">
            <p class="upload-hint">Select multiple pictures to upload</p>
        </section>

        <section class="pictures-section" id="pictures-container">
            <h2>Your Pictures</h2>
            <div id="uploaded-pictures">
            </div>
        </section>

        <section class="form-section">
            <button type="button" id="create-gift" class="create-button">Create Gift</button>
            <button type="button" id="preview-gift" class="create-button">Preview</button>
        </section>
    </main>

    <footer>
        <a href="home.html">Back to Home</a>
        <a href="edit.html">Edit Page</a>
    </footer>

    <script src="../js/animations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/create.js"></script>
</body>
</html>
